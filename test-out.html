  font-weight: 800;
  text-transform: uppercase;
}

.confidence-value {
  color: var(--text-strong);
  font-weight: 900;
  font-size: 14px;
  font-family: var(--font-sans);
}

.confidence-bar-track {
  width: 100%;
  height: 8px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 4px;
  overflow: hidden;
  padding: 1px;
  border: 1px solid rgba(212, 175, 55, 0.15);
}

.confidence-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);
}

.diagnostics-details {
  border-top: 1px solid rgba(212, 175, 55, 0.15);
  padding-top: 14px;
  margin-top: 8px;
}

.details-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 900;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.details-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-strong);
  margin-bottom: 8px;
  font-family: var(--font-sans);
}

.details-desc {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.details-action-box {
  background: linear-gradient(135deg, rgba(43, 35, 27, 0.5), rgba(27, 22, 17, 0.3));
  border: var(--brass-border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 11.5px;
  color: var(--text);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: all 0.2s ease;
}

.details-action-box:hover {
  border-color: rgba(212, 175, 55, 0.4);
}

.details-action-box.danger-action {
  background: linear-gradient(135deg, rgba(80, 20, 20, 0.3), rgba(50, 10, 10, 0.25));
  border-color: rgba(200, 75, 75, 0.35);
  color: #ffcccc;
}

.details-action-box.warn-action {
  background: linear-gradient(135deg, rgba(80, 50, 20, 0.3), rgba(50, 30, 10, 0.25));
  border-color: rgba(205, 127, 50, 0.35);
  color: #ffe8d0;
}

/* ─── Custom Interactive SVG Line Chart ─── */
.svg-chart-panel {
  background: linear-gradient(160deg, #181512 0%, #110f0d 100%);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: var(--radius);
  padding: 22px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}

.svg-chart-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.chart-header h2 {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-strong);
}

.chart-legends {
  display: flex;
  gap: 16px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}

.legend-color {
  width: 12px;
  height: 4px;
  border-radius: 2px;
}

.svg-chart-container {
  position: relative;
  width: 100%;
  height: 220px;
}

.svg-chart-graphic {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* SVG chart line & point styles (golden ink & ruby ink) */
.chart-grid-line {
  stroke: rgba(212, 175, 55, 0.08);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}

.chart-axis-line {
  stroke: rgba(212, 175, 55, 0.25);
  stroke-width: 1;
}

.chart-line-vdc {
  stroke: var(--gold); /* Gold */
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.35));
  transition: d 0.4s ease;
}

.chart-line-t1 {
  stroke: var(--error); /* Ruby Red */
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(200, 75, 75, 0.35));
  transition: d 0.4s ease;
}

.chart-area-vdc {
  fill: url(#vdcGradient);
  opacity: 0.15;
  transition: d 0.4s ease;
}

.chart-area-t1 {
  fill: url(#t1Gradient);
  opacity: 0.12;
  transition: d 0.4s ease;
}

.chart-point-vdc {
  fill: var(--gold);
  stroke: #12100d;
  stroke-width: 2;
  cursor: pointer;
  transition: r 0.2s ease, filter 0.2s ease;
}

.chart-point-vdc:hover {
  r: 6;
  filter: drop-shadow(0 0 8px var(--gold));
}

.chart-point-t1 {
  fill: var(--error);
  stroke: #12100d;
  stroke-width: 2;
  cursor: pointer;
  transition: r 0.2s ease, filter 0.2s ease;
}

.chart-point-t1:hover {
  r: 6;
  filter: drop-shadow(0 0 8px var(--error));
}

.chart-tooltip {
  position: absolute;
  background: rgba(18, 15, 13, 0.98);
  border: 1px solid rgba(212, 175, 55, 0.45);
  padding: 10px 14px;
  border-radius: 10px;
  color: var(--text-strong);
  font-size: 11px;
  pointer-events: none;
  z-index: 10;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), var(--gold-glow);
  backdrop-filter: blur(10px);
  transition: opacity 0.15s ease, left 0.1s ease, top 0.1s ease;
}

.chart-tooltip-time {
  font-weight: 900;
  color: var(--text-muted);
  margin-bottom: 5px;
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ─── Event Log Timeline ─── */
.event-log-panel {
  background: linear-gradient(160deg, #181512 0%, #110f0d 100%);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: var(--radius);
  padding: 22px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}

.event-log-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
}

.event-log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.event-log-header h2 {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-strong);
}

.event-log-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
  padding-right: 4px;
}

.event-log-list::-webkit-scrollbar {
  width: 4px;
}

.event-log-list::-webkit-scrollbar-track {
  background: transparent;
}

.event-log-list::-webkit-scrollbar-thumb {
  background: rgba(212, 175, 55, 0.25);
  border-radius: 2px;
}

.event-log-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  background: rgba(0, 0, 0, 0.3);
  border: var(--brass-border);
  border-radius: 12px;
  font-size: 12.5px;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.event-log-row:hover {
  background: rgba(212, 175, 55, 0.04);
  border-color: rgba(212, 175, 55, 0.35);
  transform: translateX(3px);
  box-shadow: var(--gold-glow);
}

.event-log-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.event-time {
  font-family: var(--font-sans);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
}

.event-badge {
  font-weight: 800;
  font-size: 9.5px;
  padding: 3px 8px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.event-badge.normal {
  background: rgba(61, 139, 91, 0.1);
  color: #8be0a7;
  border: 1px solid rgba(61, 139, 91, 0.2);
}

.event-badge.warning {
  background: rgba(205, 127, 50, 0.1);
  color: #ffc48d;
  border: 1px solid rgba(205, 127, 50, 0.25);
}

.event-badge.critical {
  background: rgba(200, 75, 75, 0.1);
  color: #ff9e9e;
  border: 1px solid rgba(200, 75, 75, 0.25);
}

.event-title {
  color: var(--text-strong);
  font-weight: 800;
  font-family: var(--font-sans);
}

.event-status {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ─── Global Dashboard Animations ─── */
@keyframes volt-pulse {
  0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
  70% { box-shadow: 0 0 0 6px rgba(212, 175, 55, 0); }
  100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
}

@keyframes slide-up-fade {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.dashboard-content .telemetry-hud-grid .hud-card {
  animation: slide-up-fade 0.5s ease both;
}

.dashboard-content .telemetry-hud-grid .hud-card:nth-child(1) { animation-delay: 0.05s; }
.dashboard-content .telemetry-hud-grid .hud-card:nth-child(2) { animation-delay: 0.1s; }
.dashboard-content .telemetry-hud-grid .hud-card:nth-child(3) { animation-delay: 0.15s; }
.dashboard-content .telemetry-hud-grid .hud-card:nth-child(4) { animation-delay: 0.2s; }
.dashboard-content .telemetry-hud-grid .hud-card:nth-child(5) { animation-delay: 0.25s; }
.dashboard-content .telemetry-hud-grid .hud-card:nth-child(6) { animation-delay: 0.3s; }

.dashboard-content .simulator-panel,
.dashboard-content .svg-chart-panel,
.dashboard-content .diagnostics-panel,
.dashboard-content .event-log-panel {
  animation: slide-up-fade 0.5s ease both;
}

.dashboard-content .simulator-panel { animation-delay: 0.08s; }
.dashboard-content .svg-chart-panel { animation-delay: 0.15s; }
.dashboard-content .diagnostics-panel { animation-delay: 0.2s; }
.dashboard-content .event-log-panel { animation-delay: 0.25s; }

/* Active Fault Pulse */
.fault-active-pulse {
  animation: fault-blink 1.2s infinite;
}

@keyframes fault-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* VoltiQ connected command UI */
[data-theme="sapphire"] {
  --bg: var(--voltiq-bg);
  --bg-elevated: var(--voltiq-bg-soft);
  --velvet: var(--voltiq-surface);
  --velvet-deep: var(--voltiq-surface-strong);
  --dark-green: var(--voltiq-bg-soft);
  --gold: var(--voltiq-gold);
  --gold-soft: var(--voltiq-gold-muted);
  --panel-glass: var(--voltiq-surface);
  --text: var(--voltiq-text);
  --text-muted: var(--voltiq-text-muted);
  --text-strong: #ffffff;
  --success: var(--voltiq-green);
  --border: var(--voltiq-border);
  --border-strong: var(--voltiq-border-strong);
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
  --gold-glow: var(--voltiq-shadow-gold);
}

body {
  background: var(--voltiq-bg);
}

.voltiq-shell {
  min-height: 100vh;
  background:
    linear-gradient(rgba(245, 185, 20, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245, 185, 20, 0.035) 1px, transparent 1px),
    radial-gradient(circle at 72% 8%, rgba(245, 185, 20, 0.06), transparent 24%),
    radial-gradient(circle at 86% 28%, rgba(255, 77, 77, 0.05), transparent 28%),
    linear-gradient(110deg, rgba(18, 16, 10, 0.72), rgba(5, 5, 4, 0.92) 36%, rgba(18, 16, 10, 0.84) 100%),
    var(--voltiq-bg);
  background-size: 70px 70px, 70px 70px, auto, auto, auto, auto;
  color: #dce5e0;
  font-family: var(--font-sans);
}

.command-header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 22px;
  height: 64px;
  padding: 0 24px;
  border-bottom: 1px solid rgba(154, 169, 162, 0.16);
  background: rgba(2, 9, 7, 0.96);
  backdrop-filter: blur(18px);
}

.command-brand {
  display: inline-flex;
  width: 388px;
  min-width: 300px;
  height: 100%;
  align-items: center;
  gap: 14px;
  border: 0;
  background: transparent;
  color: #f7fbf9;
  cursor: pointer;
  font: inherit;
  text-align: left;
}

.command-brand-mark {
  display: inline-flex;
  width: 58px;
  height: 58px;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--gold);
  border-radius: 50%;
  color: var(--gold);
  box-shadow:
    0 0 0 8px rgba(245, 185, 20, 0.055),
    var(--voltiq-shadow-gold);
}

.command-brand strong,
.command-brand small {
  display: block;
  line-height: 1.05;
  letter-spacing: 0;
}

.command-brand strong {
  color: #f7fbf9;
  font-family: var(--font-sans);
  font-size: 31px;
  font-weight: 950;
}

.command-brand small {
  margin-top: 6px;
  color: #9bad9f;
  font-size: 14px;
  font-weight: 800;
}

.command-nav,
.command-tools {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 12px;
}

.command-nav {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}

.command-nav::-webkit-scrollbar,
.command-tools::-webkit-scrollbar {
  display: none;
}

.command-nav-item,
.command-tool,
.command-user {
  border: 1px solid transparent;
  background: transparent;
  color: #edf5f1;
  cursor: pointer;
  font: inherit;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.command-nav-item {
  display: inline-flex;
  height: 34px;
  min-width: auto;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 10px;
  border-radius: 8px;
  font-weight: 500;
  font-size: 14px;
}

.command-nav-item span {
  display: block;
  white-space: nowrap;
}

.command-nav-item.active {
  border-color: rgba(245, 185, 20, 0.48);
  background: rgba(245, 185, 20, 0.08);
  color: var(--gold);
  box-shadow: inset 0 0 18px rgba(245, 185, 20, 0.08);
}

.command-nav-item:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--gold);
  border-color: rgba(245, 185, 20, 0.2);
}

.command-tool {
  position: relative;
  display: inline-flex;
  min-width: 44px;
  height: 44px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-color: rgba(154, 169, 162, 0.20);
  border-radius: 9px;
  background: rgba(12, 23, 18, 0.86);
}

.command-tool:hover,
.command-user:hover {
  border-color: rgba(245, 185, 20, 0.56);
  color: var(--gold);
}



.command-theme {
  min-width: 162px;
  gap: 10px;
  padding: 0 14px;
}

.command-theme strong {
  color: #f3f8f5;
  font-size: 17px;
  font-weight: 900;
  white-space: nowrap;
}

.theme-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(245, 185, 20, 0.78);
}

.command-bell .notice-count {
  position: absolute;
  top: -4px;
  right: -4px;
  display: inline-flex;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #ff4d4d;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.command-user {
  display: flex;
  min-width: auto;
  height: 44px;
  flex-shrink: 0;
  align-items: center;
  gap: 12px;
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg-elevated);
  text-align: left;
}

.command-avatar {
  display: inline-flex;
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--velvet-deep);
  color: var(--gold);
  border: 1px solid var(--gold);
  font-size: 14px;
  font-weight: 900;
}

.command-user strong,
.command-user small {
  display: block;
  line-height: 1.12;
  letter-spacing: 0;
}

.command-user strong {
  color: #f7fbf9;
  font-size: 16px;
  font-weight: 950;
  text-transform: uppercase;
  white-space: nowrap;
}

.name-short {
  display: none;
}

@media (max-width: 1400px) {
  .name-full { display: none; }
  .name-short { display: inline; }
  .command-nav-item { padding: 0 8px; }
}

@media (max-width: 1200px) {
  .command-nav-item span { font-size: 13px; }
  .command-user strong { font-size: 14px; }
  .command-tool { min-width: 38px; height: 38px; }
  .command-nav {
    overflow-x: auto;
    scrollbar-width: none;
  }
}

/* --- Futuristic Command Center Layout --- */

:root {
  --glow-normal: rgba(245, 185, 20, 0.4);
  --glow-warning: rgba(255, 170, 0, 0.5);
  --glow-critical: rgba(255, 77, 77, 0.5);
  
  --color-normal: #f5b914;
  --color-warning: #ffaa00;
  --color-critical: #ff4d4d;
}

.command-center-layout {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
}

.cc-grid-middle {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.cc-grid-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

@media (max-width: 1200px) {
  .cc-grid-middle, .cc-grid-bottom {
    grid-template-columns: 1fr;
  }
}

/* Premium Card Styles */
.cc-card {
  position: relative;
  background: rgba(12, 17, 14, 0.7);
  border: 1px solid rgba(154, 169, 162, 0.15);
  border-radius: 12px;
  padding: 24px;
  backdrop-filter: blur(16px);
  overflow: hidden;
  transition: all 0.3s ease;
}

.cc-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 12px;
  pointer-events: none;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5);
}

.cc-card.glow-normal { border-color: rgba(245, 185, 20, 0.3); box-shadow: 0 0 20px rgba(245, 185, 20, 0.05); }
.cc-card.glow-warning { border-color: rgba(255, 170, 0, 0.4); box-shadow: 0 0 30px rgba(255, 170, 0, 0.1); }
.cc-card.glow-critical { border-color: rgba(255, 77, 77, 0.5); box-shadow: 0 0 40px rgba(255, 77, 77, 0.15); }

/* Hero Status Component */
.hero-status-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 140px;
}

.hero-orb-container {
  position: relative;
  width: 100px;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-orb {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--color-normal) 0%, transparent 70%);
  filter: blur(8px);
}

.hero-orb.warning { background: radial-gradient(circle, var(--color-warning) 0%, transparent 70%); }
.hero-orb.critical { background: radial-gradient(circle, var(--color-critical) 0%, transparent 70%); filter: blur(12px); }

.hero-info {
  flex: 1;
  padding-left: 32px;
}

.hero-info h1 {
  font-size: 32px;
  font-weight: 800;
  margin: 0 0 8px 0;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #fff;
}

.hero-info p {
  color: #a8b5ae;
  font-size: 14px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.hero-stats {
  display: flex;
  gap: 32px;
  text-align: right;
}

.hero-stat-item strong {
  display: block;
  font-size: 28px;
  color: #fff;
  font-family: monospace;
}

.hero-stat-item span {
  font-size: 11px;
  color: #a8b5ae;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* AI Core Split Layout */
.ai-core-container {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  align-items: stretch;
}

@media (max-width: 1200px) {
  .ai-core-container {
    grid-template-columns: 1fr;
  }
}

.ai-info-panel {
  display: flex;
  flex-direction: column;
}

.ai-oversized-class {
  font-size: 72px;
  font-weight: 900;
  line-height: 1;
  font-family: monospace;
  margin-bottom: 8px;
}

.ai-oversized-confidence {
  font-size: 32px;
  font-weight: 700;
  opacity: 0.9;
  font-family: monospace;
}

.ai-meta-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px 24px;
  margin: 24px 0;
  font-size: 14px;
}

.ai-meta-list dt {
  color: #a8b5ae;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 11px;
  font-weight: 600;
}

.ai-meta-list dd {
  margin: 0;
  color: #e3ebe7;
}

.ai-actions {
  display: flex;
  gap: 12px;
  margin-top: auto;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.ai-btn {
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.3);
  color: #e3ebe7;
  transition: all 0.2s ease;
}

.ai-btn:hover {
  background: rgba(255,255,255,0.05);
  border-color: rgba(212, 175, 55, 0.4);
  color: var(--gold);
}

.ai-btn.primary {
  background: rgba(212, 175, 55, 0.1);
  border-color: rgba(212, 175, 55, 0.5);
  color: var(--gold);
}

.ai-btn.primary:hover {
  background: rgba(212, 175, 55, 0.2);
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
}

.ai-chips {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

.ai-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.08);
  color: #a8b5ae;
}

/* Diagnostic Visual Panel */
.ai-visual-panel {
  position: relative;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.03);
  overflow: hidden;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ai-visual-grid-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 20px 20px;
  background-position: center center;
  opacity: 0.5;
}

/* Sensor Matrix - 4 columns */
.sensor-matrix-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  height: 100%;
}

@media (max-width: 900px) {
  .sensor-matrix-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.matrix-card {
  background: rgba(8, 12, 10, 0.8);
  border: 1px solid rgba(154, 169, 162, 0.1);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.matrix-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #a8b5ae;
  font-size: 13px;
}

.matrix-value {
  font-size: 28px;
  color: #fff;
  font-weight: 700;
  font-family: monospace;
  margin-top: 12px;
}

/* Alert Strip */
.smart-alert-strip {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  border-radius: 50px;
  background: rgba(20, 0, 0, 0.9);
  border: 1px solid var(--color-critical);
  box-shadow: 0 10px 40px rgba(255, 77, 77, 0.2);
  backdrop-filter: blur(10px);
  color: #fff;
}

.smart-alert-strip.warning {
  background: rgba(20, 15, 0, 0.9);
  border-color: var(--color-warning);
  box-shadow: 0 10px 40px rgba(255, 170, 0, 0.2);
}

/* History Table */
.cc-table {
  width: 100%;
  border-collapse: collapse;
}

.cc-table th {
  text-align: left;
  padding: 12px;
  color: #a8b5ae;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid rgba(154, 169, 162, 0.1);
}

.cc-table td {
  padding: 16px 12px;
  color: #e3ebe7;
  font-size: 14px;
  border-bottom: 1px solid rgba(154, 169, 162, 0.05);
}

.cc-badge {
  display: inline-flex;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.cc-badge.normal { background: rgba(245, 185, 20, 0.1); color: var(--color-normal); }
.cc-badge.warning { background: rgba(255, 170, 0, 0.1); color: var(--color-warning); }
.cc-badge.critical { background: rgba(255, 77, 77, 0.1); color: var(--color-critical); }

.command-user small {
  color: #9bad9f;
  font-size: 16px;
  font-weight: 900;
}

.command-user-logout {
  display: none;
}

.voltiq-shell .sidebar {
  position: fixed;
  top: 64px;
  bottom: 0;
  left: 0;
  z-index: 210;
  width: 240px;
  height: calc(100vh - 64px);
  border-right: 1px solid rgba(154, 169, 162, 0.16);
  background: rgba(2, 8, 6, 0.97);
  overflow-y: auto;
  scrollbar-width: none;
}

.voltiq-shell .sidebar-header {
  display: none;
}

.voltiq-shell .sidebar-nav {
  padding: 8px 14px 4px;
}

.voltiq-shell .sidebar-group {
  margin-bottom: 12px;
}

.voltiq-shell .sidebar-group-title {
  margin: 0 0 4px;
  padding: 0 4px;
  color: #a8b5ae;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.15em;
  opacity: 0.8;
}

.voltiq-shell .nav-item {
  min-height: 34px;
  gap: 10px;
  margin: 4px 0;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: #e3ebe7;
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 400;
}

.voltiq-shell .nav-item:hover {
  background: var(--gold-soft);
  color: var(--text-strong);
}

.voltiq-shell .nav-item.active {
  border: 1px solid rgba(238, 179, 22, 0.5);
  background: rgba(238, 179, 22, 0.08);
  color: var(--gold);
  padding-left: 12px;
  box-shadow: 0 0 8px rgba(238, 179, 22, 0.15);
  font-weight: 500;
}

.fault-badge {
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--error-bg);
  color: var(--error);
  font-size: 10px;
  font-weight: 950;
}

.voltiq-shell .sidebar-footer {
  padding: 10px 14px 14px;
  border-top: 0;
}

.system-time-card {
  padding: 10px 14px;
  margin: 6px 0 8px;
  border: 1px solid rgba(238, 179, 22, 0.15);
  border-radius: 8px;
  background: rgba(238, 179, 22, 0.03);
  box-shadow: inset 0 0 20px rgba(238, 179, 22, 0.02);
}

.system-time-card span {
  color: #a8b5ae;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: block;
  margin-bottom: 4px;
}

.system-time-card strong {
  color: var(--text-strong);
  font-size: 18px;
  display: block;
  margin-bottom: 4px;
  font-family: monospace;
}

.system-time-card small {
  color: var(--success);
  font-weight: 600;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.system-time-card i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
}

.voltiq-shell .dashboard-main {
  width: 100%;
  min-height: 100vh;
  margin-left: 240px;
  padding-top: 64px;
}

.telemetry-dashboard-page,
.ops-page {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 30px 52px 48px;
}

.telemetry-main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 414px);
  gap: 30px;
  align-items: start;
}

.telemetry-left-stack,
.telemetry-right-stack {
  display: grid;
  gap: 24px;
}

.telemetry-hero-card,
.sensor-panel,
.alert-area-panel,
.model-strip-panel,
.status-card,
.command-center-panel,
.upload-status-panel,
.ops-panel,
.ops-stat-card {
  border: var(--gilded-border);
  border-radius: 9px;
  background:
    radial-gradient(circle at 100% 0%, rgba(212, 175, 55, 0.045), transparent 34%),
    var(--bg-elevated);
  box-shadow: var(--shadow);
}

/* --- New Dashboard Interactive Layout --- */

.dashboard-kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.sensor-icon-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  background: var(--gold-soft);
  color: var(--gold);
  border-radius: 12px;
  margin-bottom: 12px;
}

.sensor-data {
  display: flex;
  flex-direction: column;
}

.sensor-data span {
  font-size: 14px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.sensor-data strong {
  font-size: 28px;
  font-weight: 900;
  color: var(--text-strong);
}

.sensor-data small {
  font-size: 12px;
  color: var(--gold);
  margin-top: 4px;
}

.interactive-card {
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
}

.interactive-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--gold-glow);
  border-color: var(--gold);
}

.dropzone-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: 280px;
  cursor: pointer;
  border: 2px dashed var(--border);
  background: rgba(212, 175, 55, 0.02);
}

.dropzone-card:hover {
  border: 2px dashed var(--gold);
  background: rgba(212, 175, 55, 0.05);
}

.dropzone-card .hero-icon {
  color: var(--gold);
  margin-bottom: 16px;
  opacity: 0.8;
  transition: transform 0.3s ease;
}

.dropzone-card:hover .hero-icon {
  transform: scale(1.1);
  opacity: 1;
}

.centered {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.telemetry-copy h1 {
  color: var(--text-strong);
  font-family: var(--font-sans);
  font-size: 32px;
  font-weight: 950;
  letter-spacing: 0;
  margin-bottom: 12px;
}

.telemetry-copy p {
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 24px;
}

.telemetry-button-row {
  display: flex;
  gap: 16px;
  justify-content: center;
}

.interactive-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-strong);
  cursor: pointer;
  transition: all 0.2s ease;
  width: 100%;
  text-align: left;
}

.interactive-btn:hover {
  background: var(--gold-soft);
  border-color: var(--gold);
  color: var(--gold);
}

.interactive-btn.danger:hover {
  background: var(--error-bg);
  border-color: var(--error);
  color: var(--error);
}

.interactive-btn span {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.interactive-btn strong {
  font-size: 15px;
}

.interactive-btn small {
  font-size: 12px;
  color: var(--text-muted);
}

.interactive-btn em {
  font-size: 10px;
  padding: 4px 8px;
  background: rgba(212, 175, 55, 0.1);
  color: var(--gold);
  border-radius: 4px;
  font-style: normal;
  font-weight: 800;
}

.interactive-btn.danger em {
  background: var(--error-bg);
  color: var(--error);
}

.diagnostic-button,
.fault-outline {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 800;
  transition: all 0.2s ease;
  z-index: 10;
}

.diagnostic-button {
  background: var(--gold);
  color: var(--velvet-deep);
  border: 1px solid var(--gold);
  box-shadow: var(--gold-glow);
}

.diagnostic-button:hover {
  background: #e6c552;
  transform: translateY(-2px);
}

.fault-outline {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}

.fault-outline:hover {
  background: var(--gold-soft);
  transform: translateY(-2px);
}

.analysis-error {
  margin-top: 16px;
}

.inverter-stage {
  position: relative;
  display: grid;
  min-height: 310px;
  place-items: center;
  overflow: hidden;
  border-left: 1px solid rgba(154, 169, 162, 0.13);
  background:
    radial-gradient(circle at 50% 58%, rgba(245, 185, 20, 0.18), transparent 28%),
    rgba(4, 13, 10, 0.76);
}

.inverter-grid {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(rgba(245, 185, 20, 0.075) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245, 185, 20, 0.075) 1px, transparent 1px);
  background-size: 33px 33px;
  opacity: 0.58;
}

.inverter-device {
  position: relative;
  z-index: 1;
  display: grid;
  width: 154px;
  height: 210px;
  padding: 30px 22px 20px;
  border-radius: 11px;
  background: #d9e4dd;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
}

.inverter-device strong {
  color: #263830;
  font-size: 13px;
  font-weight: 950;
}

.inverter-screen {
  display: block;
.telemetry-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.telemetry-panel-header h2 {
  display: inline-flex;
  align-items: center;
  gap: 13px;
  color: #f7fbf9;
  font-family: var(--font-sans);
  font-size: 27px;
  font-weight: 950;
  letter-spacing: 0;
}

.telemetry-panel-header strong {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--gold);
  font-size: 21px;
  font-weight: 950;
}

.telemetry-panel-header strong span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 14px rgba(245, 185, 20, 0.86);
}

.telemetry-panel-header em {
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(255, 77, 77, 0.18);
  color: #ffd2d2;
  font-style: normal;
  font-weight: 950;
}

.sensor-panel,
.alert-area-panel,
.model-strip-panel,
.command-center-panel,
.upload-status-panel,
.status-card {
  padding: 28px;
}

.sensor-card-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  gap: 20px;
}

.sensor-card {
  display: grid;
  min-height: 142px;
  align-content: center;
  gap: 10px;
  padding: 22px;
  border: 1px solid rgba(154, 169, 162, 0.18);
  background: rgba(3, 16, 12, 0.56);
}

.sensor-card span {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #9bad9f;
  font-size: 17px;
}

.sensor-card span svg {
  color: var(--gold);
}

.sensor-card strong {
  color: #f7fbf9;
  font-size: 31px;
  line-height: 1;
}

.sensor-card small {
  color: #9bad9f;
  font-size: 15px;
}

.alert-area-panel {
  border-color: rgba(255, 184, 0, 0.42);
}

.alert-area-panel.stable {
  border-color: rgba(245, 185, 20, 0.32);
}

.alert-area-panel.stable .telemetry-panel-header em {
  background: rgba(245, 185, 20, 0.15);
  color: #f5b914;
}

.alert-area-card {
  display: grid;
  gap: 10px;
  padding: 22px;
  border: 1px solid rgba(255, 77, 77, 0.42);
  border-radius: 9px;
  background: rgba(255, 77, 77, 0.08);
}

.alert-area-panel.stable .alert-area-card {
  border-color: rgba(245, 185, 20, 0.24);
  background: rgba(245, 185, 20, 0.055);
}

.alert-area-card strong {
  color: #ff4d4d;
  font-size: 22px;
  font-weight: 950;
}

.alert-area-panel.stable .alert-area-card strong {
  color: #f5b914;
}

.alert-area-card span {
  color: #f7fbf9;
  font-size: 18px;
}

.alert-area-card p {
  margin: 0;
  color: #c7d2cc;
  font-size: 16px;
}

.fault-strip-list {
  display: grid;
  gap: 12px;
}

.fault-strip-row {
  display: grid;
  gap: 9px;
  padding: 14px;
  border: 1px solid rgba(154, 169, 162, 0.14);
  border-radius: 8px;
  background: rgba(3, 16, 12, 0.62);
}

.fault-strip-row > div {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
}

.fault-strip-row strong {
  color: var(--gold);
  font-size: 20px;
  font-weight: 950;
}

.fault-strip-row.critical strong {
  color: #ff4d4d;
}

.fault-strip-row.warning strong {
  color: #ffb000;
}

.fault-strip-row span {
  overflow: hidden;
  color: #f7fbf9;
  font-weight: 850;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fault-strip-row em {
  color: #9bad9f;
  font-style: normal;
}

.fault-strip-track {
  display: block;
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(154, 169, 162, 0.14);
}

.fault-strip-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), #f5b914);
}

.fault-strip-row.critical .fault-strip-track i {
  background: linear-gradient(90deg, #ff4d4d, #ffb000);
}

.fault-strip-row.warning .fault-strip-track i {
  background: linear-gradient(90deg, #ffb000, #f5b914);
}

.status-card {
  position: relative;
  min-height: 356px;
  overflow: hidden;
  padding-top: 142px;
}

.status-card dl {
  display: grid;
  gap: 16px;
  margin: 0;
}

.status-card dl div {
  display: flex;
  justify-content: space-between;
  gap: 18px;
}

.status-card dt {
  color: #9bad9f;
  font-size: 16px;
}

.status-card dd {
  margin: 0;
  color: var(--gold);
  font-size: 16px;
  font-weight: 950;
}

.status-card dd.danger {
  color: #ff4d4d;
}

.command-center-panel h2,
.upload-status-panel h3 {
  display: inline-flex;
  align-items: center;
  gap: 13px;
  color: #f7fbf9;
  font-family: var(--font-sans);
  font-size: 29px;
  font-weight: 950;
  letter-spacing: 0;
}

.command-center-actions {
  display: grid;
  gap: 12px;
  margin-top: 22px;
}

.command-center-actions button {
  display: grid;
  min-height: 106px;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 18px 20px;
  border: 1px solid rgba(154, 169, 162, 0.16);
  border-radius: 9px;
  background: rgba(3, 16, 12, 0.58);
  color: var(--gold);
  cursor: pointer;
  text-align: left;
}

.command-center-actions button:hover {
  border-color: rgba(245, 185, 20, 0.44);
  background: rgba(8, 28, 21, 0.74);
}

.command-center-actions button.danger {
  color: #ff4d4d;
}

.command-center-actions strong,
.command-center-actions small {
  display: block;
}

.command-center-actions strong {
  color: #f7fbf9;
  font-size: 17px;
  font-weight: 950;
}

.command-center-actions small {
  margin-top: 5px;
  color: #9bad9f;
  font-size: 14px;
  font-weight: 850;
  line-height: 1.3;
}

.command-center-actions em {
  padding: 6px 10px;
  border-radius: 7px;
  background: rgba(245, 185, 20, 0.92);
  color: var(--voltiq-bg);
  font-style: normal;
  font-weight: 950;
}

.command-center-actions button.danger em {
  background: rgba(255, 77, 77, 0.20);
  color: #ffb7b7;

.wattson-panel-container {

  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform-origin: bottom right;
}

.wattson-panel-header {
  padding: 16px 20px;

  border-bottom: 1px solid rgba(238, 179, 22, 0.15);

  justify-content: space-between;
}

.wattson-header-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.wattson-identity {

}

.wattson-identity h3 {
  color: #fff;
  font-size: 16px;

.wattson-status-indicator {

  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #EEB316;
}

.status-dot {
  width: 6px;
  height: 6px;

  background: #EEB316;
  box-shadow: 0 0 4px #EEB316;
}

.status-dot.sleeping { background: #8A9A8F; box-shadow: none; }
.status-dot.warning, .status-dot.annoyed { background: #ff9800; box-shadow: 0 0 4px #ff9800; }
.status-dot.critical { background: #f44336; box-shadow: 0 0 4px #f44336; }

.wattson-header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #a8b5ae;
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;

}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.icon-btn.is-active {
  border-color: rgba(238, 179, 22, 0.5);
  background: rgba(238, 179, 22, 0.12);
  color: #ffd458;

.wattson-messages-area {
  padding: 20px;

  background: #0f100f;

  max-height: 350px;
}

.wattson-message-card {
  display: flex;
  gap: 12px;
  background: #141715;
  border: 1px solid rgba(238, 179, 22, 0.1);
  border-radius: 12px;
  padding: 16px;
}

.wattson-message-content {
  flex: 1;
  color: #e3ebe7;
  font-size: 13px;
  line-height: 1.5;
}

.wattson-message-content p {
  margin: 0;
}

.user-message-bubble {
  align-self: flex-end;
  background: rgba(238, 179, 22, 0.15);
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  border-bottom-right-radius: 4px;
  border: 1px solid rgba(238, 179, 22, 0.3);
  font-size: 13px;
  max-width: 80%;
}

.wattson-divider {
  height: 1px;
  background: repeating-linear-gradient(to right, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 4px, transparent 4px, transparent 8px);
  margin: 12px 0;
}

.wattson-quick-actions-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.wattson-action-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #a8b5ae;
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  width: fit-content;

}

.wattson-action-chip:hover {
  background: rgba(238, 179, 22, 0.1);
  border-color: #EEB316;
  color: #EEB316;
}

.wattson-persistent-actions {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  background: #0b0d0c;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.wattson-persistent-actions button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #151816;
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #a8b5ae;
  padding: 8px 0;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.wattson-persistent-actions button:hover {
  background: rgba(238, 179, 22, 0.05);
  border-color: rgba(238, 179, 22, 0.3);
  color: #EEB316;
}

.wattson-input-container {
  padding: 16px 20px;
  background: #0b0d0c;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.wattson-textarea {
  width: 100%;
  height: 60px;
  background: #0f100f;
  border: 1px solid rgba(238, 179, 22, 0.4);
  border-radius: 8px;
  padding: 12px;
  color: #fff;
  font-size: 13px;
  resize: none;
  font-family: inherit;

.wattson-textarea:focus {

.wattson-textarea::placeholder {
  color: #6a756f;
}

.wattson-input-footer {
  display: flex;
  gap: 12px;
}

.wattson-btn-outline {
  flex: 1;
  background: transparent;
  border: 1px solid #EEB316;
  color: #EEB316;
  padding: 10px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.wattson-btn-outline:hover:not(:disabled) {
  background: rgba(238, 179, 22, 0.1);
}

.wattson-btn-solid {
  flex: 1;
  background: #EEB316;
  border: 1px solid #EEB316;
  color: #000;
  padding: 10px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 14px;

  transition: all 0.2s;

.wattson-avatar-3d {

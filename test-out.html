:root {
  /* Premium VoltIQ Unified Token System */
  --voltiq-bg: #050504;
  --voltiq-bg-soft: #0b0a07;
  --voltiq-surface: rgba(18, 16, 10, 0.82);
  --voltiq-surface-strong: rgba(24, 21, 13, 0.92);

  --voltiq-gold: #f5b914;

  --voltiq-gold-muted: rgba(245, 185, 20, 0.22);

  --voltiq-green: #65d83b;
  --voltiq-amber: #f0a526;
  --voltiq-red: #ef4444;
  --voltiq-gray: #8b8b8b;

  --voltiq-border: rgba(245, 185, 20, 0.22);
  --voltiq-border-strong: rgba(245, 185, 20, 0.42);

  --voltiq-text: #f5f1e8;
  --voltiq-text-muted: #a9a397;

  --voltiq-radius-sm: 10px;
  --voltiq-radius-md: 16px;
  --voltiq-radius-lg: 24px;

  --voltiq-shadow-gold: 0 0 28px rgba(245, 185, 20, 0.12);
  --voltiq-shadow-green: 0 0 22px rgba(101, 216, 59, 0.12);

  /* Legacy Backward-Compatible Aliases */
  --bg: var(--voltiq-bg);
  --bg-elevated: var(--voltiq-bg-soft);
  --velvet: var(--voltiq-surface);
  --velvet-deep: var(--voltiq-surface-strong);
  
  --gold: var(--voltiq-gold);
  --gold-soft: var(--voltiq-gold-muted);
  --panel-glass: var(--voltiq-surface);
  
  --text: var(--voltiq-text);
  --text-muted: var(--voltiq-text-muted);
  --text-strong: #ffffff;
  
  --error: var(--voltiq-red);
  --error-bg: rgba(239, 68, 68, 0.08);
  --success: var(--voltiq-green);
  --warning: var(--voltiq-amber);
  
  --border: var(--voltiq-border);
  --border-strong: var(--voltiq-border-strong);

  /* Surfaces */
  --card: var(--voltiq-surface);
  --input-bg: var(--voltiq-surface-strong);
  --sidebar-bg: var(--voltiq-bg-soft);
  --dark-green: var(--voltiq-bg-soft); /* Mapping old dark green background to dark charcoal */

  /* Typography */
  --font-sans: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif;
  --font-serif: 'Cinzel', 'Playfair Display', serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Effects */
  --radius: var(--voltiq-radius-md);
  --radius-sm: var(--voltiq-radius-sm);
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  --gold-glow: var(--voltiq-shadow-gold);
  --gilded-border: 1px solid var(--voltiq-border);
  --brass-border: 1px solid var(--voltiq-border-strong);
}

}

@media (max-width: 640px) {
  .route-block-page {
    padding: 18px;
  }

  .route-block-card {
    padding: 24px;
  }

  .route-block-status {
    align-items: flex-start;
    flex-direction: column;
  }

  .route-block-status strong {
    text-align: left;
  }
}

/* Dashboard Layout */
.dashboard {
  display: flex;
  min-height: 100vh;
  background: var(--bg);
}

/* Sidebar */
.sidebar {
  width: 250px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-header {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-mark {
  display: inline-flex;
  width: 34px;
  height: 34px;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--gold);
  border-radius: 999px;
  color: var(--gold);
  box-shadow: var(--voltiq-shadow-gold);
  font-size: 16px;
}

.logo-text {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -1.5px;
  color: var(--gold);
}

.logo-tagline {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 2px;
}

.sidebar-nav {
  padding: 16px 12px;
  flex: 1;
}

.sidebar-group {
  margin-bottom: 18px;
}

.sidebar-group-title {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 0 14px;
  margin-bottom: 6px;
  opacity: 0.55;
  user-select: none;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  margin: 2px 0;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14.5px;
  font-weight: 400;
  transition: all 0.15s ease;
  text-decoration: none;
}

.nav-item:hover {
  background: var(--voltiq-gold-muted);
  color: var(--text-strong);
}

.nav-item.active {
  background: var(--voltiq-gold-muted);
  color: var(--gold);
  font-weight: 500;
  border: 1px solid var(--voltiq-border-strong);
  box-shadow: var(--voltiq-shadow-gold);
  padding: 7px 13px; /* Adjust padding for 1px border */
}

.fault-badge {
  margin-left: auto;
  background: var(--voltiq-border);
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 3px;
  letter-spacing: 0.5px;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}

.nav-item.version {
  font-size: 12px;
  color: var(--text-muted);
  justify-content: center;
  padding: 6px;
}

/* Main Content Area */
.dashboard-main {
  flex: 1;
  margin-left: 250px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.dashboard-header {
  height: 68px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-left h1 {
  font-size: 20px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  background: var(--dark-green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--gold);
  font-size: 13px;
  border: 1px solid var(--border);
}

.user-email {
  color: var(--text-muted);
  font-size: 13px;
}

/* Dashboard Content */
.dashboard-content {
  padding: 32px 28px;
  flex: 1;
}

.dashboard-welcome {
  margin-bottom: 28px;
}

.dashboard-welcome h2 {
  font-size: 26px;
  margin-bottom: 4px;
}

.dashboard-welcome p {
  color: var(--text-muted);
}

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.stat-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
}

.stat-card .stat-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 500;
}

.stat-card .stat-value {
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  color: var(--text-strong);
  margin-bottom: 4px;
}

.stat-card .stat-change {
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.stat-card .stat-change.positive {
  color: var(--gold);
}

.stat-card .stat-change.negative {
  color: var(--error);
}

/* Placeholder sections */
.placeholder-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 20px;
}

.placeholder-section h3 {
  margin-bottom: 12px;
  font-size: 17px;
}

.placeholder-section p {
  color: var(--text-muted);
  font-size: 14.5px;
}

/* Operational pages */
.page-title-inline {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.page-title-inline svg {
  color: var(--gold);
}

.page-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 30px;
  margin-bottom: 22px;
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 22px;
  background:
    radial-gradient(circle at 85% 15%, rgba(212, 175, 55, 0.12), transparent 34%),
    linear-gradient(135deg, rgba(22, 19, 16, 0.96), rgba(15, 13, 11, 0.96));
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
}

.page-kicker {
  margin: 0 0 10px;
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.page-hero h2 {
  font-size: clamp(32px, 4vw, 54px);
  letter-spacing: -0.05em;
  margin-bottom: 8px;
}

.page-hero p:not(.page-kicker) {
  max-width: 620px;
  margin: 0;
  color: var(--text-muted);
  font-size: 16px;
}

.page-hero-icon {
  display: flex;
  width: 84px;
  height: 84px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  border-radius: 24px;
  background: rgba(212, 175, 55, 0.1);
  color: var(--gold);
  border: 1px solid rgba(212, 175, 55, 0.28);
}

.ops-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}

.ops-metric-card,
.ops-panel {
  border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(22, 19, 16, 0.96), rgba(15, 13, 11, 0.96));
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
}

.ops-metric-card {
  display: flex;
  min-height: 132px;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  border-radius: 18px;
}

.ops-metric-card span,
.ops-metric-card small,
.ops-panel-header p,
.ops-row span:not(.ops-row-primary) {
  color: var(--text-muted);
}

.ops-metric-card strong {
  color: var(--text-strong);
  font-size: 32px;
  line-height: 1;
}

.ops-metric-card small {
  color: var(--gold);
  font-weight: 700;
}

/* ─── Ops Shared UI Classes ─── */
.ops-page {
  padding: 32px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.ops-header {
  margin-bottom: 28px;
}

.ops-header h1 {
  font-size: 28px;
  color: var(--text-strong);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}

.ops-header p {
  color: var(--text-muted);
  font-size: 15px;
}

.ops-toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.ops-panel {
  background: var(--velvet);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}

.ops-table {
  width: 100%;
  border-collapse: collapse;
}

.ops-table th {
  text-align: left;
  padding: 14px 16px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border-bottom: 1px solid var(--border);
}

.ops-table td {
  padding: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  color: var(--text);
  font-size: 14px;
}

.ops-table tr:last-child td {
  border-bottom: none;
}

.ops-table tr:hover td {
  background: var(--panel-glass);
}

.ops-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
  background: var(--velvet-deep);
  border: 1px dashed var(--border);
  border-radius: 12px;
  min-height: 200px;
}

.ops-empty-icon {
  color: var(--gold);
  margin-bottom: 16px;
  opacity: 0.6;
}

.ops-empty h3 {
  font-size: 18px;
  color: var(--text-strong);
  margin-bottom: 8px;
}

.ops-stat-card {
  background: var(--velvet);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  transition: transform 0.2s, border-color 0.2s;
}

.ops-stat-card:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
}

.ops-stat-card .stat-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}

.ops-stat-card .stat-value {
  font-size: 32px;
  font-weight: 800;
  color: var(--text-strong);
  font-family: var(--font-sans);
}

.ops-controls {
  display: flex;
  min-width: min(440px, 100%);
  align-items: center;
  gap: 10px;
}

.ops-search,
.ops-filter {
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(15, 13, 11, 0.78);
  color: var(--text-strong);
  font: inherit;
  outline: none;
}

.ops-search {
  flex: 1;
  padding: 0 14px;
}

.ops-filter {
  width: 132px;
  padding: 0 10px;
}

.ops-search:focus,
.ops-filter:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.ops-table {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 16px;
}

.ops-row {
  display: grid;
  grid-template-columns: minmax(220px, 1.7fr) repeat(3, minmax(110px, 1fr));
  gap: 16px;
  align-items: center;
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
}

.ops-row:last-child {
  border-bottom: 0;
}

.ops-row:hover {
  background: rgba(212, 175, 55, 0.08);
}

.ops-row-primary {
  color: var(--text-strong);
  font-weight: 700;
}

.ops-status {
  width: fit-content;
  max-width: 100%;
}

.ops-status-online,
.ops-status-active,
.ops-status-success,
.ops-status-synced,
.ops-status-healthy,
.ops-status-ready,
.ops-status-protected,
.ops-status-live {
  color: var(--gold) !important;
}

.ops-status-warning,
.ops-status-review,
.ops-status-recommended,
.ops-status-pending,
.ops-status-in-progress {
  color: #cd7f32 !important;
  text-shadow: 0 0 4px rgba(205, 127, 50, 0.2);
}

.ops-status-critical,
.ops-status-unresolved {
  color: var(--error) !important;
  text-shadow: 0 0 6px rgba(200, 75, 75, 0.3);
}

.ops-empty {
  padding: 28px;
  color: var(--text-muted);
  text-align: center;
}

.ops-toast {
  position: fixed;
  right: 28px;
  bottom: 24px;
  z-index: 200;
  max-width: 360px;
  padding: 14px 18px;
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 16px;
  background: rgba(22, 19, 16, 0.96);
  color: var(--text-strong);
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.6);
  animation: toastIn 0.22s ease-out both;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Messages / Alerts */
.alert {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  font-size: 14px;
  border: 1px solid transparent;
}

.alert-error {
  background: var(--error-bg);
  border-color: rgba(255, 77, 77, 0.4);
  color: #ff9e9e;
}

.alert-success {
  background: rgba(212, 175, 55, 0.08);
  border-color: rgba(212, 175, 55, 0.3);
  color: var(--gold);
}

/* Responsive */
@media (max-width: 900px) {
  .auth-page {
    flex-direction: column;
  }
  
  .auth-branding {
    padding: 40px 32px;
    border-right: none;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  
  .brand-desc {
    max-width: 100%;
  }
  
  .auth-form-wrapper {
    padding: 40px 24px;
  }
  
  .sidebar {
    position: static;
    width: 100%;
    height: auto;
    flex-direction: row;
    overflow-x: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  
  .sidebar-header,
  .sidebar-footer {
    display: none;
  }
  
  .sidebar-nav {
    display: flex;
    padding: 8px 8px;
    gap: 4px;
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  
  .nav-item {
    padding: 9px 14px;
    font-size: 13px;
    white-space: nowrap;
  }
  
  .dashboard-main {
    margin-left: 0;
  }
  
  .dashboard-header {
    padding: 0 16px;
  }
  
  .dashboard-content {
    padding: 20px 16px;
  }

  .ops-metrics {
    grid-template-columns: 1fr;
  }

  .ops-row {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .page-hero {
    align-items: flex-start;
    flex-direction: column;
  }

  .ops-panel-header,
  .ops-controls {
    align-items: stretch;
    flex-direction: column;
  }

  .ops-filter {
    width: 100%;
  }
}

@media (max-width: 520px) {
  .auth-form-wrapper {
    min-width: 100%;
  }
  
  .stats-grid {
    grid-template-columns: 1fr;
  }
}

/* Utility */
.text-neon {
  color: var(--gold);
}

.muted {
  color: var(--text-muted);
}

.divider {
  height: 1px;
  background: var(--border);
  margin: 24px 0;
}

.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 16px;
}

.dashboard-command-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  gap: 28px;
  align-items: stretch;
  margin-bottom: 24px;
}

.dashboard-command-hero > div:first-child {
  padding: 34px 0 26px;
}

.hero-kicker {
  display: inline-flex;
  margin-bottom: 12px;
  color: var(--gold);
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.dashboard-command-hero h1 {
  max-width: 960px;
  color: #f7fbf9;
  font-size: clamp(38px, 5vw, 70px);
  font-weight: 950;
  letter-spacing: -0.06em;
}

.dashboard-command-hero p {
  max-width: 760px;
  margin: 14px 0 0;
  color: #aebbb4;
  font-size: 19px;
}

.dashboard-command-hero strong {
  color: #f5b914;
}

.hero-health-card {
  display: grid;
  align-content: center;
  gap: 8px;
  padding: 24px;
  border: 1px solid rgba(212, 175, 55, 0.26);
  border-radius: 10px;
  background:
    radial-gradient(circle at 80% 15%, rgba(212, 175, 55, 0.16), transparent 38%),
    rgba(15, 13, 11, 0.9);
  box-shadow: inset 0 0 40px rgba(212, 175, 55, 0.04);
}

.hero-health-card svg {
  color: var(--gold);
}

.hero-health-card span,
.hero-health-card small {
  color: #9eaaa4;
  font-weight: 800;
}

.hero-health-card strong {
  color: #f7fbf9;
  font-size: 46px;
  line-height: 1;
}

.stat-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.stat-card-top svg {
  color: var(--gold);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.85fr);
  gap: 20px;
  margin-bottom: 22px;
}

.dashboard-grid-wide {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.dashboard-live-panel,
.ai-decision-panel,
.site-health-panel,
.recent-faults-panel {
  padding: 24px;
}

.panel-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.panel-title-row h2 {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 950;
}

.panel-title-row h2 svg {
  color: var(--gold);
}

.panel-title-row button,
.live-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 0 14px;
  border: 1px solid rgba(212, 175, 55, 0.28);
  border-radius: 999px;
  background: rgba(22, 19, 16, 0.62);
  color: var(--gold);
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 950;
}

.live-pill.blue {
  border-color: rgba(212, 175, 55, 0.28);
  background: rgba(212, 175, 55, 0.08);
  color: var(--gold);
}

.energy-flow-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.energy-flow-card {
  display: grid;
  gap: 7px;
  padding: 18px;
  border: 1px solid rgba(212, 175, 55, 0.14);
  border-radius: 10px;
  background: rgba(22, 19, 16, 0.76);
}

.energy-flow-card span,
.energy-flow-card small,
.dashboard-live-panel p {
  color: var(--text-muted);
}

.energy-flow-card strong {
  color: var(--text-strong);
  font-size: 30px;
  line-height: 1;
}

.flow-meter {
  height: 10px;
  margin: 20px 0 14px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.12);
}

.flow-meter span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--gold-soft));
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.4);
}

.ai-decision-panel dl,
.site-health-list,
.recent-fault-list {
  display: grid;
  gap: 12px;
  margin: 0;
}

.ai-decision-panel dl div,
.site-health-row,
.recent-fault-row {
  display: grid;
  align-items: center;
  gap: 12px;
  min-height: 54px;
  padding: 12px 14px;
  border: 1px solid rgba(212, 175, 55, 0.12);
  border-radius: 8px;
  background: rgba(15, 13, 11, 0.7);
}

.ai-decision-panel dl div {
  grid-template-columns: 1fr auto;
}

.ai-decision-panel dt,
.site-health-row small,
.recent-fault-row p {
  color: var(--text-muted);
}

.ai-decision-panel dd,
.site-health-row strong {
  margin: 0;
  color: var(--gold);
  font-weight: 950;
}

.site-health-row {
  grid-template-columns: minmax(180px, 1.4fr) 90px 110px 80px;
}

.site-health-row span,
.recent-fault-row span {
  color: var(--text-strong);
  font-weight: 850;
}

.site-health-row em,
.recent-fault-row em {
  justify-self: end;
  color: var(--success);
  font-style: normal;
  font-weight: 950;
}

.site-health-row em.warn,
.recent-fault-row em.warn {
  color: #cd7f32;
}

.recent-fault-row em.danger {
  color: var(--error);
}

.recent-fault-row {
  grid-template-columns: 54px 90px minmax(0, 1fr) 84px;
}

.recent-fault-row strong {
  color: #ff4d4d;
  font-size: 20px;
}

/* VoltiQ command-center screens */
.voltiq-shell {
  min-height: 100vh;
  position: relative;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at center, var(--gold-soft) 0%, transparent 75%),
    linear-gradient(rgba(212, 175, 55, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 175, 55, 0.015) 1px, transparent 1px);
  background-size: 100% 100%, 48px 48px, 48px 48px;
  background-position: center;
  background-attachment: fixed;
}

.voltiq-shell .sidebar {
  width: 240px;
  top: 0;
  bottom: 0;
  height: 100vh;
  background: linear-gradient(160deg, rgba(27, 22, 18, 0.94) 0%, rgba(15, 13, 11, 0.8) 50%, rgba(12, 10, 9, 0.9) 100%);
  border-right: 1px solid rgba(212, 175, 55, 0.14);
  overflow-y: auto;
  scrollbar-width: none;
  backdrop-filter: blur(12px);
}

.voltiq-shell .dashboard-main {
  margin-left: 240px;
  padding-top: 64px;
}

.voltiq-shell .sidebar-header {
  display: block;
  padding: 32px 24px 16px;
}

.au-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
}
.au-brand__icon {
  color: var(--gold);
  display: flex;
  filter: drop-shadow(0 0 10px var(--gold-soft));
}
.au-brand__name {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 950;
  color: var(--text-strong);
  letter-spacing: -0.02em;
}

.voltiq-shell .logo {
  gap: 12px;
}

.voltiq-shell .logo-mark {
  width: 68px;
  height: 68px;
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 24px rgba(245, 185, 20, 0.22);
}

.voltiq-shell .logo-text {
  font-family: var(--font-serif);
  display: block;
  color: #f4f9f7;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -0.06em;
}

.voltiq-shell .logo-tagline {
  margin-top: 4px;
  color: #92a29a;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

.voltiq-shell .sidebar-nav {
  padding: 14px 14px 16px;
}

.voltiq-shell .sidebar-group-title {
  color: #a2afa9;
  font-size: 15px;
  letter-spacing: 0.22em;
  opacity: 0.9;
}

.voltiq-shell .nav-item {
  min-height: 47px;
  border: 1px solid transparent;
  border-radius: 9px;
  color: #e3ebe7;
  font-size: 20px;
  font-weight: 900;
}

.voltiq-shell .nav-item svg {
  flex: 0 0 auto;
}

.voltiq-shell .nav-item.active {
  background: var(--velvet);
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-left-width: 1px;
  color: var(--gold);
  padding-left: 14px;
  box-shadow: var(--gold-glow);
}

.voltiq-shell .sidebar-footer {
  padding: 12px 14px 10px;
  border-top: 0;
}

.system-time-card {
  display: grid;
  gap: 8px;
  min-height: 126px;
  padding: 18px 16px;
  border: 1px solid rgba(212, 175, 55, 0.16);
  border-radius: 8px;
  background: rgba(15, 13, 11, 0.92);
  box-shadow: inset 0 0 28px rgba(212, 175, 55, 0.03);
}

.system-time-card span {
  color: var(--text-strong);
  font-size: 20px;
}

.system-time-card strong {
  color: #fff;
  font-size: 22px;
  line-height: 1;
}

.system-time-card small {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-strong);
  font-weight: 800;
}

.system-time-card i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
}

.command-header {
  position: fixed;
  inset: 0 0 auto 240px;
  z-index: 220;
  height: 64px;
  padding: 0 24px;
  background: rgba(12, 11, 10, 0.94);
  border-bottom: 1px solid rgba(212, 175, 55, 0.14);
  backdrop-filter: blur(18px);
}

.command-nav,
.command-tools {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.command-nav {
  flex: 1;
  justify-content: flex-start;
  overflow-x: auto;
  scrollbar-width: none;
}

.command-nav::-webkit-scrollbar,
.command-tools::-webkit-scrollbar {
  display: none;
}

.command-nav-item,
.command-tool {
  border: 1px solid transparent;
  background: transparent;
  color: #edf5f1;
  cursor: pointer;
  font: inherit;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}

.command-nav-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: auto;
  max-width: none;
  padding: 0 12px;
  height: 34px;
  justify-content: center;
  border-radius: 8px;
  font-weight: 500;
  font-size: 14px;
  flex-shrink: 0;
}

.command-nav-item span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.command-nav-item.active {
  color: var(--gold);
  background: var(--dark-green);
  border-color: rgba(212, 175, 55, 0.5);
  box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1), var(--gold-glow);
}

.command-tool {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  min-width: 44px;
  border-radius: 9px;
  border-color: rgba(212, 175, 55, 0.18);
  background: rgba(27, 22, 18, 0.72);
  flex-shrink: 0;
}

.command-search-container {
  display: inline-flex;
  align-items: center;
  height: 44px;
  width: 180px;
  border: 1px solid rgba(212, 175, 55, 0.18);
  border-radius: 9px;
  background: rgba(27, 22, 18, 0.72);
  padding: 0 12px;
  gap: 8px;
  position: relative;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.command-search-container:hover {
  border-color: rgba(212, 175, 55, 0.4);
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.1);
}

.command-search-container:focus-within {
  border-color: var(--voltiq-gold, #d4af37);
  box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1), var(--gold-glow);
  background: rgba(12, 23, 18, 0.86);
  width: 220px;
}

.command-search-icon {
  color: #9eaaa4;
  flex-shrink: 0;
  transition: color 0.3s ease;
}

.command-search-container:focus-within .command-search-icon {
  color: var(--voltiq-gold, #d4af37);
}

.command-search-input {
  background: transparent;
  border: none;
  color: #fff;
  outline: none;
  font-size: 13px;
  width: 100%;
  padding: 0;
  height: 100%;
}

.command-search-input::placeholder {
  color: rgba(158, 170, 164, 0.6);
}

.command-search-shortcut {
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.2);
  color: #9eaaa4;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.command-search-container:focus-within .command-search-shortcut {
  border-color: rgba(212, 175, 55, 0.4);
  color: var(--voltiq-gold, #d4af37);
  opacity: 0.5;
}

.command-icon:hover,
.command-theme:hover {
  border-color: rgba(212, 175, 55, 0.4);
  color: var(--gold);
}

.command-theme {
  min-width: 140px;
  gap: 8px;
  padding: 0 12px;
}

.theme-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.command-bell .notice-count {
  position: absolute;
  top: -9px;
  right: -7px;
  display: inline-flex;
  width: 28px;
  height: 28px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #ff4d4d;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
}

.command-user {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: auto;
  height: 44px;
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg-elevated);
  flex-shrink: 0;
  white-space: nowrap;
}

.command-avatar {
  display: inline-flex;
  width: 32px;
  height: 32px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--velvet-deep);
  color: var(--gold);
  border: 1px solid var(--gold);
  font-size: 14px;
  font-weight: 900;
  flex-shrink: 0;
}

.command-user strong,
.command-user small {
  display: block;
  line-height: 1.15;
}

.command-user strong {
  color: #f7fbf9;
  font-size: 20px;
  letter-spacing: 0.01em;
}

.command-logout {
  color: #dce5e0;
}

.command-logout:disabled {
  opacity: 0.55;
  cursor: wait;
}

.command-user small {
  color: #8A9990;
  font-size: 11px;
  font-weight: 500;
}

.ops-content {
  position: relative;
  padding: 24px 52px 40px;
}

.ops-content-analytics {
  padding-top: 6px;
}

.analytics-layout {
  display: grid;
  gap: 24px;
}

.analytics-forecast {
  position: relative;
  min-height: 124px;
  overflow: visible;
  padding: 18px 32px 28px;
}

.forecast-line {
  position: relative;
  height: 30px;
  border: 1px solid rgba(245, 185, 20, 0.15);
  border-radius: 8px;
  background: linear-gradient(180deg, rgba(9, 20, 17, 0.86), rgba(4, 10, 8, 0.82));
}

.forecast-line span {
  position: absolute;
  top: 4px;
  width: 1px;
  height: 20px;
  background: rgba(245, 185, 20, 0.1);
}

.forecast-line span:nth-child(1) { left: 16%; }
.forecast-line span:nth-child(2) { left: 34%; }
.forecast-line span:nth-child(3) { left: 52%; }
.forecast-line span:nth-child(4) { left: 70%; }
.forecast-line span:nth-child(5) { left: 88%; }

.forecast-days {
  display: flex;
  justify-content: space-between;
  padding-top: 14px;
  color: #9aa9a2;
}

.analytics-forecast .robot-mascot {
  position: absolute;
  right: 18%;
  top: -2px;
}

.analytics-card-grid {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(300px, 1fr) minmax(260px, 1fr);
  gap: 20px;
}

.analytics-card {
  min-height: 414px;
  padding: 28px;
}

.analytics-card h2,
.hourly-header h2,
.fault-panel-header h2 {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 22px;
  font-weight: 900;
}

.fault-bars {
  display: grid;
  gap: 24px;
  margin-top: 22px;
}

.fault-bar-label {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
  color: #98a9a0;
  font-size: 16px;
}

.fault-bar-label strong {
  color: #f5fbf8;
}

.fault-code {
  font-weight: 900;
}

.fault-code.blue,
.fault-bar-fill.blue,
.accent-blue {
  color: var(--gold);
}

.fault-code.red,
.temp-hot,
.status-fault {
  color: #ff4d4d !important;
}

.fault-bar-track {
  height: 5px;
  overflow: hidden;
  margin-top: 6px;
  border-radius: 999px;
  background: rgba(154, 169, 162, 0.12);
}

.fault-bar-fill {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: rgba(154, 169, 162, 0.34);
}

.fault-bar-fill.blue {
  background: var(--gold);
}

.fault-bar-fill.red {
  background: #ff4d4d;
}

.card-note {
  margin: 28px 0 0;
  padding-top: 20px;
  border-top: 1px solid rgba(154, 169, 162, 0.18);
  color: #b4c0ba;
}

.savings-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.saving-tile {
  display: grid;
  gap: 6px;
  min-height: 120px;
  padding: 18px;
  border: 1px solid rgba(245, 185, 20, 0.22);
  border-radius: 10px;
  background: rgba(16, 40, 12, 0.46);
}

.saving-tile span,
.saving-tile small,
.model-card dt {
  color: #99aaa2;
}

.saving-tile strong {
  color: var(--gold);
  font-size: 27px;
  line-height: 1.1;
}

.tariff-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid rgba(154, 169, 162, 0.16);
  color: #aebbb4;
}

.tariff-row strong,
.model-card dd {
  color: var(--gold);
}

.model-card dl {
  display: grid;
  gap: 20px;
  margin: 24px 0 0;
}

.model-card dl div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.model-card dd {
  margin: 0;
  font-weight: 900;
}

.model-online {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 26px 0 0;
  padding-top: 18px;
  border-top: 1px solid rgba(154, 169, 162, 0.16);
  color: #b4c0ba;
}

.model-online span,
.hourly-header strong span,
.fault-panel-header strong span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(245, 185, 20, 0.8);
}

.hourly-panel {
  padding: 28px;
}

.hourly-header,
.fault-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 26px;
}

.hourly-header strong,
.fault-panel-header strong {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--gold);
  font-size: 22px;
}

.hourly-table-wrap {
  overflow-x: auto;
}

.hourly-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 940px;
}

.hourly-table th,
.hourly-table td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(154, 169, 162, 0.14);
  text-align: left;
}

.hourly-table th {
  color: #99aaa2;
  font-size: 14px;
  text-transform: uppercase;
}

.hourly-table td {
  color: #f0f5f2;
}

.hourly-table td:first-child {
  color: #9fb0a7;
}

.hourly-table .row-watch {
  background: rgba(255, 255, 255, 0.035);
}

.status-normal {
  color: var(--gold) !important;
  font-weight: 900;
}

.status-watch {
  color: #f0f5f2;
  font-weight: 900;
}

.robot-mascot {
  display: grid;
  justify-items: center;
  width: 150px;
  color: #f5b914;
  filter: drop-shadow(0 0 16px rgba(245, 185, 20, 0.72));
}

.robot-mascot.compact {
  width: 58px;
}

.robot-mascot svg {
  width: 100%;
  height: auto;
}

.robot-mascot span {
  margin-top: -8px;
  padding: 2px 12px 3px;
  border: 1px solid rgba(245, 185, 20, 0.5);
  border-radius: 999px;
  background: #062318;
  color: var(--gold);
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
}

.robot-mascot.compact span {
  display: none;
}

.robot-head,
.robot-face,
.robot-body {
  fill: #07130f;
  stroke: currentColor;
  stroke-width: 5;
}

.robot-ear,
.robot-glow {
  fill: rgba(244, 255, 239, 0.86);
  stroke: currentColor;
  stroke-width: 4;
}

.robot-antenna,
.robot-arm,
.robot-smile {
  fill: none;
  stroke: currentColor;
  stroke-width: 6;
  stroke-linecap: round;
}

.robot-eye,
.robot-eye-dot,
.robot-core {
  fill: currentColor;
}

.fault-hero {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 28px;
  align-items: center;
  min-height: 208px;
  padding: 22px 8px 20px;
}

.fault-hero h1 {
  color: #f3f8f5;
  font-size: clamp(58px, 7vw, 104px);
  font-weight: 950;
  letter-spacing: -0.06em;
}

.fault-hero h1 span {
  color: var(--gold);
}

.fault-hero p {
  margin: 16px 0 0;
  color: #c7d2cc;
  font-size: 24px;
}

.fault-add-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-width: 184px;
  height: 60px;
  border: 0;
  border-radius: 9px;
  background: #70ef00;
  color: #030b09;
  cursor: pointer;
  font: inherit;
  font-size: 20px;
  font-weight: 950;
}

.fault-filters {
  display: flex;
  gap: 14px;
  padding: 18px;
}

.fault-filters button {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 50px;
  min-width: 188px;
  height: 54px;
  padding: 0 20px;
  border: 1px solid rgba(154, 169, 162, 0.18);
  border-radius: 9px;
  background: rgba(17, 34, 27, 0.8);
  color: #f5fbf8;
  cursor: pointer;
  font: inherit;
  font-size: 19px;
  font-weight: 900;
}

.fault-timeline-panel {
  padding: 28px;
  border-color: rgba(245, 185, 20, 0.36);
}

.fault-timeline-grid {
  display: grid;
  grid-template-columns: minmax(360px, 1.5fr) minmax(300px, 0.85fr);
  gap: 22px;
}

.fault-timeline-list {
  position: relative;
  display: grid;
  gap: 16px;
  padding-left: 34px;
}

.fault-timeline-list::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 14px;
  bottom: 14px;
  width: 2px;
  background: var(--gold);
}

.timeline-item {
  position: relative;
  display: grid;
  grid-template-columns: 54px 1fr;
  align-items: center;
  min-height: 92px;
  padding: 16px 26px 16px 52px;
  border: 1px solid rgba(154, 169, 162, 0.2);
  border-radius: 9px;
  background: rgba(17, 28, 24, 0.94);
  color: #aebbb4;
  cursor: pointer;
  font: inherit;
  text-align: left;
}

.timeline-item.active {
  border-color: rgba(245, 185, 20, 0.78);
  background: rgba(21, 53, 24, 0.72);
}

.timeline-item strong {
  color: #ff3f4c;
  font-size: 20px;
  font-weight: 950;
}

.timeline-item.warning strong {
  color: #ffb000;
}

.timeline-item > span:last-child {
  max-width: 190px;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.35;
}

.timeline-dot {
  position: absolute;
  left: -24px;
  width: 20px;
  height: 20px;
  border: 4px solid #ff3f4c;
  border-radius: 50%;
  background: #030b09;
}

.timeline-item.warning .timeline-dot {
  border-color: #ffb000;
}

.fault-detail-card {
  min-height: 330px;
  padding: 26px 22px;
  border: 1px solid rgba(154, 169, 162, 0.2);
  border-radius: 9px;
  background: rgba(17, 28, 24, 0.94);
}

.fault-detail-card p:first-child {
  margin: 0 0 12px;
  color: #ff3f4c;
  font-size: 18px;
}

.fault-detail-card h3 {
  color: #ff3f4c;
  font-size: 24px;
  font-weight: 950;
}

.fault-desc {
  margin: 18px 0 26px;
  color: #d5ded9;
  font-size: 20px;
}

.fault-detail-card dl {
  display: grid;
  gap: 16px;
  margin: 0;
}

.fault-detail-card dl div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.fault-detail-card dt {
  color: #99aaa2;
  font-size: 19px;
}

.fault-detail-card dd {
  margin: 0;
  color: #aebbb4;
  font-size: 20px;
  font-weight: 950;
}

.wattson-panel {
  max-width: 520px;
  overflow: hidden;
  border: 1px solid rgba(245, 185, 20, 0.34);
  border-radius: 10px;
  background: rgba(6, 16, 13, 0.96);
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.34);
}

.wattson-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(245, 185, 20, 0.24);
  background: rgba(19, 42, 15, 0.6);
}

.wattson-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.wattson-title h3 {

/* Phone-specific fixes to prevent "corrupted" layout */
@media (max-width: 640px) {
  /* Hide the wide sidebar completely on phones - rely on header command-nav */
  .voltiq-shell .sidebar {
    display: none !important;
  }

  .voltiq-shell .dashboard-main {
    margin-left: 0 !important;
    padding-top: 0 !important;
    width: 100% !important;
  }

  /* Make main content full bleed and stack nicely */
  .dashboard-main {
    margin-left: 0 !important;
  }

  /* Wattson panel: make it usable on small screens */
  .wattson-panel-container {
    width: 96% !important;
    max-width: 100vw !important;
    left: 2% !important;
    right: 2% !important;
    border-radius: 12px !important;
  }

  /* Launcher: bigger tap target, better positioning on phones */
  .wattson-launcher-custom,
  .chatbot-launcher {
    width: 56px !important;
    height: 56px !important;
    bottom: 16px !important;
    right: 16px !important;
  }

  /* Ensure no horizontal overflow and readable text */
  body, .dashboard, .voltiq-shell {
    overflow-x: hidden;
  }

  .cfg-panel, .ops-panel, .ai-panel {
    padding: 16px !important;
    margin: 8px !important;
  }

  /* Stack 2-col grids */
  .cfg-grid-2 {
    grid-template-columns: 1fr !important;
  }

  /* Make buttons and inputs finger-friendly */
  button, .cfg-input, .cfg-toggle {
    min-height: 44px !important;
  }

  /* Command nav in header should be more compact/scrollable on phone */
  .command-nav {
    gap: 4px;
    font-size: 12px;
  }

  .command-nav-item {
    padding: 6px 10px;
  }
}

@media (max-width: 720px) {
  .analytics-card-grid,
  .savings-grid,
  .wattson-quick-actions,
  .wattson-send-row {
    grid-template-columns: 1fr;
  }

  .analytics-forecast {

    bottom: -2px;

  }
}

/* AI telemetry analysis dashboard */
.ai-upload-zone {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  margin-bottom: 18px;
  padding: 18px;
  border: 1px dashed rgba(245, 185, 20, 0.36);
  border-radius: 10px;
  background:
    radial-gradient(circle at 10% 0%, rgba(245, 185, 20, 0.12), transparent 34%),
    rgba(6, 18, 14, 0.74);
}

.ai-upload-zone div {
  display: grid;
  gap: 5px;
}

.ai-upload-zone strong {
  color: #f7fbf9;
  font-size: 18px;
}

.ai-upload-zone span,
.ai-upload-zone small {
  color: #9eaaa4;
}

.analysis-error {
  margin-bottom: 16px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 77, 77, 0.36);
  border-radius: 8px;
  background: rgba(255, 77, 77, 0.09);
  color: #ffaaaa;
  font-weight: 750;
}

.model-distribution-panel,
.alert-action-panel {
  padding: 24px;
}

.model-class-bars,
.alert-stack {
  display: grid;
  gap: 12px;
}

.model-class-row {
  display: grid;
  gap: 9px;
  padding: 13px 14px;
  border: 1px solid rgba(154, 169, 162, 0.12);
  border-radius: 8px;
  background: rgba(6, 18, 14, 0.72);
}

.model-class-row > div:first-child {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}

.model-class-row strong,
.alert-action-card strong {
  color: var(--gold);
  font-size: 20px;
}

.model-class-row.critical strong,
.alert-action-card.critical strong {
  color: #ff4d4d;
}

.model-class-row.warning strong,
.alert-action-card.warning strong {
  color: #fbbf24;
}

.model-class-row span,
.alert-action-card span {
  color: #f7fbf9;
  font-weight: 850;
}

.model-class-row em,
.alert-action-card small {
  color: #9eaaa4;
  font-style: normal;
}

.model-class-track {
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(154, 169, 162, 0.12);
}

.model-class-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), #f5b914);
}

.model-class-row.critical .model-class-track span {
  background: linear-gradient(90deg, #ff4d4d, #fbbf24);
}

.model-class-row.warning .model-class-track span {
  background: linear-gradient(90deg, #fbbf24, #f5b914);
}

.alert-action-card {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr);
  gap: 12px;
  padding: 14px;
  border: 1px solid rgba(154, 169, 162, 0.14);
  border-radius: 8px;
  background: rgba(6, 18, 14, 0.76);
}

.alert-action-card div {
  display: grid;
  gap: 4px;
}

@media (max-width: 720px) {
  .ai-upload-zone,
  .model-class-row > div:first-child,
  .alert-action-card {
    grid-template-columns: 1fr;
  }

/* Command Header User Dropdown Styling */
@keyframes dropdownFadeIn {
  from { opacity: 0; transform: translateY(-10px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.command-user-dropdown {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 8px;
  background-color: #0A0E0C;
  border: 1px solid #1c231f;
  border-radius: 8px;
  width: 260px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.05);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: dropdownFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.cmd-dropdown-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  color: var(--text-muted) !important;
  background: transparent !important;
  border: none !important;
  width: 100% !important;
  text-align: left !important;
  font-family: var(--font-sans) !important;
  font-size: 13px !important;
  font-weight: 500 !important;
  cursor: pointer !important;
  transition: all 0.2s ease !important;
  box-shadow: none !important;
  border-radius: 0 !important;
}

.cmd-dropdown-item:hover {
  background: rgba(212, 175, 55, 0.05) !important;
  color: var(--gold) !important;
}

.cmd-dropdown-item-danger:hover {
  background: rgba(255, 77, 77, 0.05) !important;
  color: #FF4D4D !important;
}

/* Reusable Premium Custom Select Styles */
.custom-select-container {
  position: relative;
  width: 100%;
}

.custom-select-trigger {
  background: #020403;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  padding: 10px 14px;
  color: #e3ebe7;
  font-size: 13.5px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s ease;
  user-select: none;
}

.custom-select-trigger:hover {
  border-color: rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.01);
}

.custom-select-container.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

.custom-select-caret {
  transition: transform 0.2s ease;
  color: #a8b5ae;
}

  transform: rotate(180deg);
}

.custom-select-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: #090e0b;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.02);

  max-height: 200px;
  overflow-y: auto;
  padding: 4px;
}

.custom-select-dropdown::-webkit-scrollbar {
  width: 4px;
}
.custom-select-dropdown::-webkit-scrollbar-track {
  background: transparent;
}
.custom-select-dropdown::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
}

.custom-select-option {
  padding: 10px 12px;
  color: #a8b5ae;
  font-size: 13.5px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s ease;
}

.custom-select-option:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}

.custom-select-option.selected {
  background: rgba(212, 175, 55, 0.12);
  color: #ffd458;
  font-weight: 600;
}

.au-tab--inactive:hover { color: #fff; background: rgba(255,255,255,0.04); }

/* ── Card inner padding ─────────────────────────────────────────── */
.au-card__body { padding: 4px 18px 0; }

/* Icon box */
.au-card__icon {
  width: 44px;
  height: 44px;
  background: rgba(212, 175, 55, 0.1);
  border: 1.5px solid rgba(212, 175, 55, 0.25);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  margin-bottom: 16px;
}

/* Title */
.au-card__title {
  font-family: var(--font-serif, serif);
  font-size: 26px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 6px;
}
.au-card__title span { color: var(--gold); }

.au-card__sub {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-bottom: 22px;
  line-height: 1.5;
}

/* ── Error / success banner ─────────────────────────────────────── */
.au-alert {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 14px;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 18px;
}
.au-alert--error {
  background: rgba(200, 75, 75, 0.1);
  border: 1.5px solid rgba(200, 75, 75, 0.35);
  color: #ff9e9e;
}
.au-alert--success {
  background: rgba(61, 139, 91, 0.1);
  border: 1.5px solid rgba(61, 139, 91, 0.3);
  color: #8be0a7;
}

.au-alert span {
  flex: 1;
}

.au-alert-action {
  flex: 0 0 auto;
  border: 1px solid currentColor;
  border-radius: 7px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 900;
  padding: 6px 10px;
}

.au-alert-action:hover {
  background: rgba(255, 255, 255, 0.08);
}

/* ── Form fields ─────────────────────────────────────────────────── */
.au-field { margin-bottom: 14px; }
.au-label {
  display: block;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--text-muted);
  letter-spacing: 0.13em;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.au-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.au-input-icon {
  position: absolute;
  left: 14px;
  color: var(--text-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}
.au-input {
  width: 100%;
  background: rgba(12, 10, 9, 0.95);
  border: 1.5px solid rgba(212, 175, 55, 0.25);
  border-radius: 11px;
  padding: 12px 16px 12px 42px;
  font-size: 14px;
  color: #fff;
  font-family: var(--font-sans), sans-serif;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
  height: 48px;
  min-height: 48px;
}
.au-input::placeholder { color: rgba(162, 150, 136, 0.4); font-size: 13.5px; }
.au-input:focus {
  border-color: var(--gold);
  box-shadow: var(--gold-glow);
}
.au-input--pr { padding-right: 46px; }

.au-eye-btn {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  padding: 4px;
  transition: color 0.2s;
}
.au-eye-btn:hover { color: #fff; }

/* 2-col grid for names / passwords */
.au-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* Phone row */
.au-phone-row {
  display: flex;
  gap: 10px;
}
.au-select-wrap {
  position: relative;
  flex-shrink: 0;
  width: 110px;
}
.au-select {
  width: 100%;
  background: rgba(12, 10, 9, 0.95);
  border: 1.5px solid rgba(212, 175, 55, 0.25);
  border-radius: 11px;
  padding: 12px 30px 12px 12px;
  font-size: 13.5px;
  color: #fff;
  font-family: var(--font-sans), sans-serif;
  outline: none;
  appearance: none;
  cursor: pointer;
  min-height: 48px;
  transition: border-color 0.2s;
}
.au-select:focus { border-color: var(--gold); box-shadow: var(--gold-glow); }
.au-select-chevron {
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  display: flex;
}

/* Remember + forgot */
.au-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.au-remember {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 500;
}
.au-remember input {
  width: 15px; height: 15px;
  accent-color: var(--gold);
  cursor: pointer;
}
.au-forgot {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  text-decoration: none;
  border: none;
  background: none;
  cursor: pointer;
  font-family: var(--font-sans), sans-serif;
}
.au-forgot:hover { text-decoration: underline; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.au-btn-primary {
  width: 100%;
  padding: 14px 20px;
  border-radius: 11px;
  background: linear-gradient(135deg, #d4af37 0%, #c5a059 100%);
  color: #0c0b0a;
  font-weight: 900;
  font-size: 15px;
  letter-spacing: 0.03em;
  font-family: var(--font-sans), serif;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: all 0.22s ease;
  animation: buttonGlow 3s ease-in-out infinite;
}
.au-btn-primary:hover:not(:disabled) {
  animation: none;
  background: linear-gradient(135deg, #e5c158, #d4af37);
  box-shadow: 0 10px 32px rgba(212, 175, 55, 0.4), var(--gold-glow);
  transform: translateY(-1.5px);
}
.au-btn-primary:active:not(:disabled) { transform: translateY(0); }
.au-btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

@keyframes buttonGlow {
  0%, 100% { box-shadow: 0 6px 24px rgba(212, 175, 55, 0.2); }
  50% { box-shadow: 0 6px 36px rgba(212, 175, 55, 0.4); }
}

.au-or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 14px 0;
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 0.1em;
}
.au-or::before, .au-or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(212, 175, 55, 0.25);
}

.au-btn-google {
  width: 100%;
  padding: 12px 16px;
  border-radius: 11px;
  background: rgba(255,255,255,0.03);
  border: 1.5px solid rgba(212, 175, 55, 0.25);
  color: var(--text);
  font-weight: 700;
  font-size: 14px;
  font-family: var(--font-sans), sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.22s ease;
}
.au-btn-google:hover {
  background: rgba(255,255,255,0.065);
  border-color: var(--gold);
  color: #fff;
  transform: translateY(-1px);
}
.au-btn-google:disabled { opacity: 0.55; cursor: not-allowed; }

/* Switch link */
.au-switch {
  text-align: center;
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 14px;
}
.au-switch__link {
  color: var(--gold);
  font-weight: 700;
  text-decoration: none;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13.5px;
  font-family: var(--font-sans), sans-serif;
  margin-left: 4px;
}
.au-switch__link:hover { text-decoration: underline; }

/* Security badges row */
.au-security {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding-top: 14px;
  margin-top: 14px;
  border-top: 1px solid rgba(212, 175, 55, 0.15);
  flex-wrap: wrap;
}
.au-security__item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-muted);
  padding: 0 10px;
}
.au-security__item svg { color: var(--gold); }
.au-security__sep {
  color: rgba(212, 175, 55, 0.25);
  font-size: 13px;
}

/* Loading spinner */
.au-spinner {
  width: 15px;
  height: 15px;
  border: 2px solid rgba(12, 10, 9, 0.3);
  border-top-color: #0c0b0a;
  border-radius: 50%;
  animation: auSpin 0.65s linear infinite;
}
.au-spinner--white {
  border-color: rgba(255,255,255,0.2);
  border-top-color: #fff;
}
@keyframes auSpin { to { transform: rotate(360deg); } }

/* Password strength */
.au-strength-bars {
  display: flex;
  gap: 3px;
  margin-top: 7px;
}
.au-strength-bar {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: rgba(212, 175, 55, 0.15);
  transition: background 0.3s;
}

/* Phone preview */
.au-phone-preview {
  font-size: 10.5px;
  color: var(--gold);
  margin-top: 5px;
  letter-spacing: 0.04em;
}


/* Password match indicator */
.au-match {
  font-size: 10.5px;
  font-weight: 700;
  margin-top: 6px;
}
.au-match--ok  { color: #3d8b5b; }
.au-match--bad { color: #c84b4b; }

/* ── Responsive ─────────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .au-right { width: 50%; }
  .au-left  { padding: 28px 32px 24px; }
}

@media (max-width: 920px) {
  .au-page { flex-direction: column; height: auto; overflow: auto; }
  .au-left {
    min-height: 340px;
    padding: 28px 24px;
  }
  .au-right {
    width: 100%;
    min-height: auto;
    padding: 20px 16px 32px;
  }
  .au-hero-wrap { max-height: 220px; }
}

@media (max-width: 560px) {
  .au-grid-2 { grid-template-columns: 1fr; }
  .au-card { padding: 6px 6px 20px; }
  .au-card__body { padding: 4px 12px 0; }
  .au-stats { flex-wrap: wrap; }
  .au-stat { flex: 1 0 40%; }
}

@media (min-width: 921px) {
  .au-page {
    height: 100vh;
    overflow: hidden;
  }
  .au-left {
    flex: 0 0 50%;
    width: 50%;
  }
  .au-left__content {
    justify-content: center;
  }
  .au-brand {
    margin-bottom: 18px;
  }
  .au-badge {
    margin-bottom: 10px;
  }
  .au-headline {
    margin-bottom: 8px;
    font-size: clamp(26px, 3vw, 38px);
  }
  .au-tagline {
    margin-bottom: 14px;
    font-size: 13.5px;
  }
  .au-stats {
    margin-bottom: 14px;
  }
  .au-right {
    position: relative;
    z-index: 1;
    flex: 0 0 50%;
    width: 50%;
    height: 100vh;
    padding: 16px 24px;
    overflow: hidden;
    background: rgba(12, 10, 9, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .au-card {
    max-width: 520px;
    width: 100%;
    max-height: calc(100vh - 32px);
    overflow: hidden;
    padding: 8px 8px 16px;
  }
  .au-card__body {
    padding: 2px 14px 0;
  }
  .au-tabs {
    margin-bottom: 12px;
  }
  .au-card__icon {
    width: 32px;
    height: 32px;
    margin-bottom: 8px;
    border-radius: 8px;
  }
  .au-card__icon svg {
    width: 16px;
    height: 16px;
  }
  .au-card__title {
    font-size: 20px;
    margin-bottom: 2px;
  }
  .au-card__sub {
    font-size: 12px;
    margin-bottom: 12px;
  }
  .au-field {
    margin-bottom: 8px;
  }
  .au-label {
    font-size: 9px;
    margin-bottom: 3px;
  }
  .au-input {
    height: 36px;
    min-height: 36px;
    padding: 8px 12px 8px 34px;
    font-size: 13px;
    border-radius: 8px;
  }
  .au-input-icon {
    left: 11px;
  }
  .au-input-icon svg {
    width: 12px;
    height: 12px;
  }
  .au-select-wrap {
    width: 95px;
  }
  .au-select {
    min-height: 36px;
    padding: 8px 24px 8px 8px;
    font-size: 12.5px;
    border-radius: 8px;
  }
  .au-btn-primary {
    padding: 10px 16px;
    font-size: 14px;
    margin-top: 10px !important;
    border-radius: 8px;
  }
  .au-or {
    margin: 8px 0;
    font-size: 10px;
  }
  .au-btn-google {
    padding: 9px 12px;
    font-size: 13px;
    border-radius: 8px;
  }
  .au-switch {
    margin-top: 8px;
    font-size: 12.5px;
  }
  .au-switch__link {
    font-size: 12.5px;
  }
  .au-security {
    margin-top: 8px;
    padding-top: 8px;
  }
  .au-phone-preview {
    font-size: 9px;
    margin-top: 2px;
  }
  .au-match {
    font-size: 9px;
    margin-top: 2px;
  }
  .au-select-trigger {
    height: 36px;
    min-height: 36px;
    padding: 0 24px 0 12px;
    font-size: 12.5px;
    border-radius: 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
  }
}

/* ── Custom Select Dropdown ─────────────────────────────────────── */
.au-select-trigger {
  width: 100%;
  background: rgba(12, 10, 9, 0.95);
  border: 1.5px solid rgba(212, 175, 55, 0.25);
  border-radius: 11px;
  color: #fff;
  cursor: pointer;
  z-index: 10;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.au-select-trigger:focus, .au-select-trigger--open {
  border-color: var(--gold);
  box-shadow: var(--gold-glow);
}

.au-select-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 250px;
  max-height: 240px;
  background: rgba(18, 15, 12, 0.98);
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 12px;
  box-shadow: var(--shadow);
  z-index: 1000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: auFadeIn 0.15s ease both;
}

.au-custom-scrollbar::-webkit-scrollbar {
  width: 5px;
}
.au-custom-scrollbar::-webkit-scrollbar-thumb {
  background: rgba(212, 175, 55, 0.25);
  border-radius: 4px;
}
.au-custom-scrollbar::-webkit-scrollbar-thumb:hover {
  background: rgba(212, 175, 55, 0.45);
}

/* ================================================================
   New Sleek Solar System Illustration Component Styling
   ================================================================ */
.au-illustration-container {
  position: relative;
  width: clamp(420px, 46vw, 680px); /* slightly wider for cinematic feel */
  max-height: clamp(260px, 34vh, 380px);
  margin: 40px auto 20px;
  flex-shrink: 0;
  display: block;
  z-index: 2;
  aspect-ratio: 580 / 320;
  transform: scale(1.25);
  transform-origin: center center;
}

@media (max-height: 900px) {
  .au-illustration-container {
    transform: scale(1.05);
    margin: 30px auto 0;
  }
}

@media (max-height: 820px) {
  .au-illustration-container {
    transform: scale(0.82);
    transform-origin: center top;
    margin: 5px auto -30px;
  }
}

@media (max-height: 600px) {
  .au-illustration-container {
    display: none;
  }
}

.au-illustration-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* -- Performance Glassmorphic Card -- */
.au-illustration-card {
  position: absolute;
  top: 90px;
  left: 20px;
  width: 210px;
  height: 160px;
  background: rgba(18, 15, 12, 0.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(212, 175, 55, 0.15);
  border-radius: 16px;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
  z-index: 5;
  transition: border-color 0.3s, box-shadow 0.3s;
  animation: floatIllustrationCard 7s ease-in-out infinite;
}

.au-ill-card__ambient {
  position: absolute;
  inset: -10%;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
  z-index: -1;
  pointer-events: none;
}

.au-ill-card__title {
  font-size: 9px;
  font-weight: 800;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  opacity: 0.9;
}
.au-ill-card__subtitle {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}

.au-ill-gauge-wrap {
  position: relative;
  width: 140px;
  height: 75px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.au-ill-gauge-svg {
  width: 100%;
  height: 100%;
}

.au-ill-gauge-val {
  position: absolute;
  bottom: 6px;
  font-family: var(--font-sans);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.01em;
}

/* ── POWER CHIPS (Clean Row) ── */
.au-chip-row {
  position: absolute;
  bottom: 0px;
  left: 20px;
  display: flex;
  gap: 12px;
  z-index: 6;
}

.au-ill-badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  background: rgba(18, 15, 12, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  white-space: nowrap;
  letter-spacing: 0.08em;
  font-family: var(--font-sans);
  box-shadow: 0 8px 16px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  animation: floatBadge 6s ease-in-out infinite;
}

.au-ill-badge:nth-child(2) { animation-delay: 1.5s; }
.au-ill-badge:nth-child(3) { animation-delay: 3s; }

.au-ill-badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 20px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
}

.au-ill-badge--gold {
  border: 1px solid rgba(212, 175, 55, 0.25);
  color: #ffd97d;
}

.au-ill-badge--muted {
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
}

@keyframes floatBadge {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* -- Inverter Unit (Grey metallic 3D cylinder/box) -- */
.au-inverter-unit {
  position: absolute;
  top: 90px;
  right: 50px;
  width: 110px;
  height: 160px;
  background: linear-gradient(145deg, rgba(39, 34, 30, 0.85) 0%, rgba(28, 24, 20, 0.85) 50%, rgba(18, 16, 13, 0.85) 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(212, 175, 55, 0.15);
  border-radius: 16px;
  box-shadow:
    inset 1px 1px 2px rgba(255, 255, 255, 0.05),
    0 20px 40px rgba(0, 0, 0, 0.6);
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 22px;
  animation: floatInverter 8s ease-in-out infinite 0.5s;
}

.au-inverter-ambient {
  position: absolute;
  inset: -20%;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
  z-index: -1;
  pointer-events: none;
}

.au-inverter-brand {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.au-inverter-screen {
  position: relative;
  width: 44px;
  height: 44px;
  background: #0c0b0a;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
  margin-top: 15px;
}

.au-inverter-glow-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(212, 175, 55, 0.3);
  animation: inverterPulse 3s ease-in-out infinite;
}

.au-inverter-icon {
  color: var(--gold);
  filter: drop-shadow(0 0 3px var(--gold));
}

@keyframes inverterPulse {
  0% { transform: scale(0.9); opacity: 0; }
  50% { transform: scale(1.1); opacity: 0.6; }
  100% { transform: scale(1.3); opacity: 0; }
}

/* Float Animations */
@keyframes floatIllustrationCard {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes floatInverter {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* Animations for panel and nodes */
.au-panel-float {
  animation: floatPanel 10s ease-in-out infinite;
}
